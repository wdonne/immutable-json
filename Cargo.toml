[package]
description = "Immutable JSON transformations"
edition = "2024"
exclude = ["*.iml"]
homepage = "https://github.com/wdonne/immutable-json"
keywords = ["immutable", "json"]
license = "BSD-2-Clause"
name = "immutable-json"
readme = "README.md"
repository = "https://github.com/wdonne/immutable-json"
version = "1.5.0"

[dependencies]
bson = { version = "3.1.0", optional = true, features = ["chrono-0_4"] }
bytes = { version = "1.12.1", optional = true }
chrono = { version = "0.4.45", optional = true, features = ["alloc"] }
config = { version = "0.15.27", optional = true }
imbl = "7.0.2"
imbl-util = "1.1.0"
indexmap = { version = "2.14.2", optional = true }
jaq-core = { version = "3.1.2", optional = true }
jaq-json = { version = "2.0.3", optional = true }
jaq-std = { version = "3.0.4", optional = true }
json-patch = { version = "4.2.0", optional = true }
rust-yaml = { version = "1.1.0", optional = true }
serde_json = "1.0.154"
take-until = "0.3.0"

[features]
bson = ["dep:bson", "dep:chrono"]
config = ["dep:config"]
jaq = ["dep:bytes", "dep:jaq-core", "dep:jaq-json", "dep:jaq-std"]
patch = ["dep:json-patch"]
yaml = ["dep:indexmap", "dep:rust-yaml"]

[package.metadata.docs.rs]
all-features = true
